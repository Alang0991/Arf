<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furry Krew</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#05060a;
  overflow:hidden;
  color:#fff;
}

/* glow blobs */
.blob{
  position:absolute;
  width:400px;
  height:400px;
  filter:blur(120px);
  opacity:0.25;
  border-radius:50%;
  animation:float 10s infinite ease-in-out;
}

.blob.one{ background:#00f5ff; top:-100px; left:-100px; }
.blob.two{ background:#ff4fd8; bottom:-120px; right:-120px; }
.blob.three{ background:#ffd36a; top:40%; left:60%; animation-delay:2s; }

@keyframes float{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(40px,-30px);}
}

/* main panel */
.panel{
  width:min(92%,950px);
  padding:2rem;
  border-radius:22px;
  background:rgba(10,12,18,0.75);
  border:1px solid rgba(0,255,255,0.15);
  backdrop-filter:blur(18px);
  box-shadow:0 0 60px rgba(0,255,255,0.08);
  position:relative;
}

/* scan effect */
.panel::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(0,255,255,0.08),transparent);
  transform:translateX(-100%);
  animation:sweep 6s infinite;
}
@keyframes sweep{
  0%{transform:translateX(-100%);}
  50%{transform:translateX(100%);}
  100%{transform:translateX(100%);}
}

/* header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.title{
  font-size:clamp(1.6rem,4vw,2.6rem);
  font-weight:700;
  background:linear-gradient(90deg,#7df9ff,#ff4fd8,#ffd36a);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* FIXED status pill (clean, no lore) */
.status{
  font-size:0.75rem;
  padding:6px 12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.04);
  opacity:0.85;
  letter-spacing:0.5px;
}

/* description */
.lore{
  margin-top:1rem;
  font-size:clamp(0.85rem,3vw,1rem);
  line-height:1.6;
  opacity:0.85;
  border-left:3px solid rgba(0,255,255,0.4);
  padding-left:12px;
}

/* links */
.grid{
  margin-top:1.5rem;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  transition:0.25s;
  text-decoration:none;
  color:#fff;
}

.card:hover{
  transform:translateY(-4px);
  border-color:rgba(0,255,255,0.3);
  box-shadow:0 0 20px rgba(0,255,255,0.15);
}

/* mobile */
@media(max-width:650px){
  .grid{grid-template-columns:1fr;}
}

.footer{
  margin-top:1.5rem;
  font-size:0.7rem;
  opacity:0.5;
  text-align:center;
}
</style>
</head>

<body>

<div class="blob one"></div>
<div class="blob two"></div>
<div class="blob three"></div>

<div class="panel">

  <div class="header">
    <div class="title">🐾 Furry Krew</div>
    <div class="status">NETWORK • ONLINE</div>
  </div>

  <div class="lore">
    Welcome to <strong>Furry Krew</strong> — a VRChat community built for social worlds, creativity, and hanging out with friends.
  </div>

  <div class="grid">
    <a class="card" href="https://vrchat.com/home/group/grp_1b22718f-1f0a-42af-93eb-22ba049b4486">🌐 VRChat Group</a>
    <a class="card" href="https://discord.gg/Y7rNaHzq3e">💬 Discord</a>
    <a class="card" href="https://x.com/FKrew48811">🐦 X / Twitter</a>
    <a class="card" href="https://www.tiktok.com/@furry_krew">🎵 TikTok</a>
  </div>

  <div class="footer">Furry Krew</div>

</div>

</body>
</html>
